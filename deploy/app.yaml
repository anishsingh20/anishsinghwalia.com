name: anish-singh-walia
region: blr
services:
  - name: web
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    http_port: 8080
    build_command: npm ci && npm run build
    run_command: npm start
    envs:
      - key: PORT
        value: "8080"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        value: https://anishsinghwalia.com
      - key: CONTACT_TO
        value: waliaanish1997@gmail.com
      - key: CONTACT_FROM
        value: waliaanish1997@gmail.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: LLM_BASE_URL
        value: https://inference.do-ai.run/v1
      - key: LLM_MODEL
        value: llama3.3-70b-instruct
