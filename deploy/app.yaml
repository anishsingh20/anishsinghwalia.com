name: anish-singh-walia
region: blr
services:
  - name: web
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    http_port: 8080
    build_command: npm ci && npm run build
    run_command: npm start
    envs:
      - key: PORT
        value: "8080"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        value: https://anishsinghwalia.com
      - key: CONTACT_TO
        value: waliaanish1997@gmail.com
      - key: CONTACT_FROM
        value: waliaanish1997@gmail.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: LLM_BASE_URL
        value: https://inference.do-ai.run/v1
      - key: LLM_MODEL
        value: llama3.3-70b-instruct
      # Set these as encrypted env vars in the dashboard. Never commit values.
      # - key: SMTP_USER
      # - key: SMTP_PASS
      # - key: LLM_API_KEY
      # - key: TAVILY_API_KEY   # or BRAVE_SEARCH_API_KEY / SERPER_API_KEY / EXA_API_KEY
      # - key: GITHUB_TOKEN
